<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1280" height="720" fill="#172554"/>
  <!-- document -->
  <g>
    <rect x="90" y="170" width="320" height="420" rx="14" fill="#f8fafc"/>
    <rect x="130" y="220" width="240" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="130" y="256" width="200" height="16" rx="8" fill="#cbd5e1"/>
    <rect x="130" y="292" width="240" height="16" rx="8" fill="#e2e8f0"/>
    <!-- hidden malicious line highlighted -->
    <rect x="130" y="336" width="240" height="34" rx="6" fill="#fecaca"/>
    <text x="140" y="360" font-size="22" fill="#b91c1c">…ignore all instructions…</text>
    <rect x="130" y="392" width="180" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="130" y="428" width="220" height="16" rx="8" fill="#e2e8f0"/>
    <text x="250" y="560" font-size="28" fill="#475569" text-anchor="middle" font-weight="600">PDF в RAG</text>
  </g>
  <!-- arrow into LLM -->
  <g stroke="#38bdf8" stroke-width="6" fill="none">
    <path d="M430 380 C 520 380, 520 380, 600 380"/>
    <path d="M588 366 l 18 14 l -18 14" fill="#38bdf8"/>
  </g>
  <!-- LLM brain chip -->
  <g>
    <rect x="610" y="290" width="180" height="180" rx="24" fill="#1e40af" stroke="#60a5fa" stroke-width="4"/>
    <text x="700" y="365" font-size="34" fill="#e0f2fe" text-anchor="middle" font-weight="700">LLM</text>
    <text x="700" y="410" font-size="26" fill="#93c5fd" text-anchor="middle">RAG</text>
    <g stroke="#60a5fa" stroke-width="5">
      <line x1="650" y1="290" x2="650" y2="255"/><line x1="700" y1="290" x2="700" y2="255"/><line x1="750" y1="290" x2="750" y2="255"/>
      <line x1="650" y1="470" x2="650" y2="505"/><line x1="700" y1="470" x2="700" y2="505"/><line x1="750" y1="470" x2="750" y2="505"/>
    </g>
  </g>
  <!-- broken exfiltration path (red dashed + X) -->
  <g stroke="#f87171" stroke-width="5" stroke-dasharray="12 10" fill="none">
    <path d="M800 380 C 900 380, 940 300, 1010 300"/>
  </g>
  <g stroke="#ef4444" stroke-width="8">
    <line x1="880" y1="330" x2="920" y2="370"/><line x1="920" y1="330" x2="880" y2="370"/>
  </g>
  <text x="1060" y="308" font-size="26" fill="#fca5a5">attacker</text>
  <!-- shielded correct path -->
  <g stroke="#34d399" stroke-width="5" fill="none">
    <path d="M800 400 C 900 420, 950 470, 1010 480"/>
    <path d="M998 466 l 18 14 l -20 10" fill="#34d399"/>
  </g>
  <g>
    <path d="M870 430 l 0 44 q 0 34 44 48 q 44 -14 44 -48 l 0 -44 l -44 -16 z" fill="#065f46" stroke="#34d399" stroke-width="4"/>
    <text x="914" y="482" font-size="30" fill="#a7f3d0" text-anchor="middle" font-weight="700">✓</text>
  </g>
  <!-- title -->
  <text x="90" y="112" font-size="44" fill="#f8fafc" font-weight="700">Prompt Injection через документ</text>
  <text x="90" y="152" font-size="26" fill="#7dd3fc">что не работает — и defense-in-depth, который работает</text>
  <!-- legend -->
  <text x="610" y="640" font-size="24" fill="#94a3b8" text-anchor="middle">полученный текст = недоверенные данные, не команды</text>
</svg>
