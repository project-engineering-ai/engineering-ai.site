<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#g1)" opacity="0.35"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="120" y1="600" x2="1180" y2="600"/>
    <line x1="120" y1="160" x2="120" y2="600"/>
  </g>
  <!-- bars: memory footprint -->
  <g>
    <rect x="220" y="230" width="140" height="370" rx="8" fill="#64748b"/>
    <rect x="450" y="300" width="140" height="300" rx="8" fill="#38bdf8"/>
    <rect x="680" y="390" width="140" height="210" rx="8" fill="#818cf8"/>
    <rect x="910" y="415" width="140" height="185" rx="8" fill="#34d399"/>
    <text x="290" y="215" fill="#cbd5e1" font-size="26" text-anchor="middle">FP16</text>
    <text x="520" y="285" fill="#cbd5e1" font-size="26" text-anchor="middle">Q8_0</text>
    <text x="750" y="375" fill="#cbd5e1" font-size="26" text-anchor="middle">Q5_K_M</text>
    <text x="980" y="400" fill="#cbd5e1" font-size="26" text-anchor="middle">Q4_K_M</text>
    <text x="290" y="640" fill="#94a3b8" font-size="24" text-anchor="middle">100%</text>
    <text x="520" y="640" fill="#94a3b8" font-size="24" text-anchor="middle">51%</text>
    <text x="750" y="640" fill="#94a3b8" font-size="24" text-anchor="middle">34%</text>
    <text x="980" y="640" fill="#94a3b8" font-size="24" text-anchor="middle">28%</text>
  </g>
  <!-- speed arrows -->
  <g font-size="30" fill="#fbbf24" font-weight="600">
    <text x="1080" y="310">×1.8</text>
    <text x="1080" y="400">×2.4</text>
    <text x="1080" y="440">×3.1 ⚡</text>
  </g>
  <!-- title -->
  <text x="120" y="105" fill="#f8fafc" font-size="46" font-weight="700">Квантование LLM: память vs скорость</text>
  <text x="120" y="145" fill="#7dd3fc" font-size="26"> GGUF Q8/Q5/Q4 — цена одного бита качества</text>
</svg>
